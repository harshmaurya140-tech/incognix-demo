<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>incognix-core — Live PII Redaction Demo</title>
  </head>
  <body style="max-width: 820px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #111827;">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div>
        <h1 style="font-size: 24px; margin: 0;">incognix-core — Live Demo</h1>
        <p style="color: #6b7280; margin: 4px 0 0; font-size: 14px;">Zero-cloud, client-side PII redaction &amp; reversible tokenization</p>
      </div>
      <a href="https://www.npmjs.com/package/incognix-core" target="_blank" rel="noreferrer" style="font-size: 13px; color: #111827; text-decoration: none; border: 1px solid #d1d5db; padding: 6px 12px; border-radius: 6px;">
        npm: incognix-core@0.1.1 ↗
      </a>
    </header>

    <section style="margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <label for="prompt-input" style="font-weight: 600; font-size: 14px;">Raw Prompt Input</label>
        <div style="display: flex; gap: 10px; align-items: center; font-size: 13px;">
          <label>Default Country:
            <select id="country-select" style="padding: 2px 6px;">
              <option value="IN">IN (+91)</option>
              <option value="US">US (+1)</option>
              <option value="GB">GB (+44)</option>
            </select>
          </label>
          <button id="reset-btn" style="cursor: pointer; padding: 2px 8px;">Reset Sample</button>
        </div>
      </div>
      <textarea id="prompt-input" rows="4" style="width: 100%; padding: 12px; font-size: 14px; border-radius: 8px; border: 1px solid #d1d5db; box-sizing: border-box;"></textarea>
    </section>

    <section id="risk-bar" style="display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;"></section>

    <section style="margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span id="output-label" style="font-weight: 600; font-size: 14px;">Redacted Output (Safe to send to LLM)</span>
        <button id="toggle-btn" style="cursor: pointer; padding: 5px 12px; border-radius: 6px; border: 1px solid #111827; background: #fff; color: #111827; font-size: 13px;">
          Test restore() Round-Trip
        </button>
      </div>
      <pre id="output-box" style="background: #f9fafb; border: 1px solid #e5e7eb; padding: 14px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; margin: 0;"></pre>
    </section>

    <section>
      <h2 style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Local Token Vault (Never leaves browser)</h2>
      <pre id="tokens-box" style="background: #111827; color: #f9fafb; padding: 14px; border-radius: 8px; font-size: 13px; overflow-x: auto; margin: 0;"></pre>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
